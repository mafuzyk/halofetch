[package]
name = "atlasfetch"
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "System information fetch with centered logos, powerline panels and a live monitor"
repository = "https://github.com/mafuzyk/atlasfetch"
readme = "README.md"
keywords = ["fetch", "linux", "terminal", "system-information", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "atlasfetch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
color-eyre = "0.6"
libc = "0.2"
directories = "6"
unicode-width = "0.2"
regex = "1"
portable-pty = "0.9.0"
vt100 = { version = "0.15.2", package = "vt100" }
