name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.packages }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          archive="atlasfetch-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" atlasfetch
          sha256sum "$archive" > "$archive.sha256"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atlasfetch-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            atlasfetch-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
