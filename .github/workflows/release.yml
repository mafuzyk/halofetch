name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: ""
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.packages }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        if: matrix.archive == 'tar.gz'
        run: |
          archive="halofetch-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" halofetch
          sha256sum "$archive" > "$archive.sha256"

      - name: Package binary (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "halofetch-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $files = @(
            "target/${{ matrix.target }}/release/halofetch.exe",
            "LICENSE",
            "README.md"
          )
          Compress-Archive -Path $files -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  $archive" -Encoding ascii

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: halofetch-${{ matrix.target }}
          path: |
            halofetch-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            halofetch-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            halofetch-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            halofetch-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          generate_release_notes: true
